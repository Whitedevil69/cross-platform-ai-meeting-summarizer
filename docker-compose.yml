# Development docker-compose — starts LiveKit only.
# For full production stack (backend + ollama + livekit), use:
#   docker compose -f docker-compose.prod.yml up -d

services:

  # ── LiveKit server (WebRTC room) ─────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"        # HTTP / WebSocket
      - "7881:7881"        # TCP RTC
      - "50000-50200:50000-50200/udp"  # UDP media (narrow range for dev)
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml
